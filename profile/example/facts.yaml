# ═══════════════════════════════════════════════════════════════════════
# 검증된 사실의 단일 출처 (예시) — profile/facts.yaml 로 복사해 본인 내용으로 바꾼다
#
#  ▶ 원칙: 여기 없는 수치는 이력서에 쓸 수 없다 (fail-closed)
#  ▶ fact_guard 가 생성물에서 숫자를 정규식으로 뽑아 이 목록과 대조한다
# ═══════════════════════════════════════════════════════════════════════

# ── 절대 금지 ──────────────────────────────────────────────────────────
# 근거가 없어 폐기했거나, 설계서와 실제가 달라 정정한 값. 문자열로 직접 매칭해 잡는다.
banned:
  - pattern: "99%"
    reason: 근거 미확인으로 폐기 (예시)
  - pattern: "old-model-name"
    reason: 교체된 모델명 (예시)
    replace_with: "new-model-name"

# ── 검증 완료 — 그대로 써도 되는 사실 ──────────────────────────────────
# numbers 에 적은 문자열만 이력서 문장에 등장할 수 있다.
facts:
  - id: example_metric
    claim: 응답 지연 3.2초 · 처리량 하루 1만 건
    numbers: ["3.2초", "1만"]
    evidence: 어디서 측정했는지 — 파일 경로·문서명·측정일

  - id: example_scale
    claim: 대상 데이터 120만 건 규모
    numbers: ["120만"]
    evidence: 근거 문서

# ── 구조적 사실 (fact_guard 가 수치로 오인하지 않도록 등록) ────────────
# 생년월일·재직 기간·연락처처럼 이력서에 항상 나오는 숫자를 여기에 넣는다.
structural:
  numbers:
    - "1996.01.01"
    - "2024.02"
    - "2024.12"
    - "10개월"
    - "2023.02"
    - "010-0000-0000"
